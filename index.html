<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendientes Correos</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:#fcfcfb; --page:#f2f3f7;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
    --gridline:#e6e5e0; --border: rgba(11,11,11,0.08);
    --good:#0ca30c; --good-bg:#e6f6e6;
    --warning:#b8790a; --warning-bg:#fdf1d9;
    --neutral-bg:#eeede9; --neutral-ink:#52514e;
    --critical:#d03b3b; --critical-bg:#fbe6e6;
    --accent:#4a3aa7; --accent-bg:#efecfb; --accent-2:#6c5ce0;
    --pdf:#d03b3b; --xls:#0ca35f; --generic:#52514e;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1:#1a1a19; --page:#0d0d0d;
      --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
      --gridline:#2c2c2a; --border: rgba(255,255,255,0.10);
      --good:#0ca30c; --good-bg:#123a17;
      --warning:#e0a53a; --warning-bg:#3a2f10;
      --neutral-bg:#262624; --neutral-ink:#c3c2b7;
      --critical:#e66767; --critical-bg:#3a1414;
      --accent:#9085e9; --accent-bg:#241f3d; --accent-2:#9085e9;
      --pdf:#e66767; --xls:#1baf7a; --generic:#c3c2b7;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --text-primary:#fff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --gridline:#2c2c2a; --border: rgba(255,255,255,0.10);
    --good:#0ca30c; --good-bg:#123a17;
    --warning:#e0a53a; --warning-bg:#3a2f10;
    --neutral-bg:#262624; --neutral-ink:#c3c2b7;
    --critical:#e66767; --critical-bg:#3a1414;
    --accent:#9085e9; --accent-bg:#241f3d; --accent-2:#9085e9;
    --pdf:#e66767; --xls:#1baf7a; --generic:#c3c2b7;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--page); color: var(--text-primary); }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px 64px; }

  header.top {
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background: var(--surface-1); border-bottom: 1px solid var(--border);
    padding: 12px 20px; position: sticky; top:0; z-index: 5;
  }
  .brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; white-space:nowrap; }
  .brand .logo { width:26px; height:26px; border-radius:8px; background: var(--accent); flex-shrink:0; }

  .search { flex:1; min-width:160px; max-width:320px; }
  .search input {
    width:100%; padding: 8px 12px; border-radius:9px; border:1px solid var(--gridline);
    background: var(--page); font-size:13px; color: var(--text-primary);
  }

  .sync-pill { display:flex; align-items:center; gap:6px; font-size:12.5px; color: var(--text-secondary); white-space:nowrap; }
  .sync-pill .dot { width:7px; height:7px; border-radius:50%; background: var(--good); }
  .sync-pill.err .dot { background: var(--critical); }

  .sync-btn {
    background: var(--accent-2); color:#fff; border:none; border-radius:9px;
    padding: 8px 14px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .sync-btn:disabled { opacity:.6; cursor:default; }

  .user { display:flex; align-items:center; gap:8px; margin-left:auto; white-space:nowrap; }
  .user .av { width:32px; height:32px; border-radius:50%; background: var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; }
  .user .who { font-size:12.5px; line-height:1.3; }
  .user .who b { display:block; font-size:13px; }
  .theme-btn { border:1px solid var(--border); background: var(--page); color: var(--text-secondary); border-radius:8px; padding:6px 9px; font-size:12px; cursor:pointer; }

  .tabs { display:flex; gap:4px; background: var(--surface-1); padding: 6px 20px 0; border-bottom:1px solid var(--border); overflow-x:auto; }
  .tab { padding: 9px 14px; font-size:13px; font-weight:600; color: var(--text-muted); border-bottom:2px solid transparent; white-space:nowrap; cursor:pointer; }
  .tab.active { color: var(--accent); border-color: var(--accent); }

  .error-box { background: var(--critical-bg); color: var(--critical); border-radius:10px; padding:12px 14px; font-size:13px; margin:16px 0; line-height:1.5; }

  .greet {
    background: var(--surface-1); border:1px solid var(--border); border-radius:16px;
    padding: 18px 20px; margin-top:18px; display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .greet-left { display:flex; gap:14px; }
  .greet-icon { width:42px; height:42px; border-radius:50%; background: var(--accent-bg); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .greet h2 { margin:0 0 4px; font-size:18px; }
  .greet h2 span { color: var(--accent); }
  .greet p { margin: 0 0 6px; font-size:13px; color: var(--text-secondary); }
  .greet .calm { font-size:12.5px; color: var(--good); font-weight:600; }
  .urgent-toggle { display:flex; align-items:center; gap:8px; background: var(--warning-bg); color: var(--warning); font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:10px; align-self:flex-start; white-space:nowrap; cursor:pointer; border:none; }
  .urgent-toggle.active { outline: 2px solid var(--warning); }

  .pace {
    background: var(--surface-1); border:1px solid var(--border); border-radius:14px;
    padding: 14px 18px; margin-top:12px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .pace-text b { display:block; font-size:13.5px; }
  .pace-text span { font-size:12.5px; color: var(--text-secondary); }
  .pace-bar-wrap { min-width: 180px; }
  .pace-bar-top { display:flex; justify-content:space-between; font-size:11.5px; color: var(--text-muted); margin-bottom:4px; }
  .pace-bar { width:100%; height:7px; border-radius:999px; background: var(--neutral-bg); overflow:hidden; }
  .pace-bar-fill { height:100%; background: var(--accent-2); }

  .empty-state { text-align:center; padding: 48px 20px; color: var(--text-secondary); }
  .empty-state .big { font-size:34px; margin-bottom:8px; }

  .company {
    background: var(--surface-1); border:1px solid var(--border); border-radius:16px;
    margin-top:14px; overflow:hidden;
  }
  .company-header { display:flex; align-items:center; gap:12px; padding:16px 18px; cursor:pointer; }
  .co-icon { width:38px; height:38px; border-radius:10px; background: var(--accent-bg); color: var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; }
  .co-main { flex:1; min-width:0; }
  .co-title-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .co-name { font-weight:700; font-size:15.5px; }
  .co-badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background: var(--accent-bg); color: var(--accent); }
  .co-sub { font-size:12.5px; color: var(--text-muted); margin-top:2px; }
  .co-toggle { font-size:12.5px; font-weight:600; color: var(--text-secondary); background: var(--page); border:1px solid var(--gridline); border-radius:8px; padding:7px 12px; white-space:nowrap; }

  .co-body { display:none; padding: 0 18px 18px; }
  .company.open .co-body { display:block; }
  .co-sortline { display:flex; justify-content:space-between; font-size:12px; color: var(--text-muted); padding: 10px 0; border-top:1px solid var(--gridline); margin-bottom:6px; }

  .task { border: 1px solid var(--gridline); border-radius:14px; padding:16px; margin-bottom:12px; background: var(--page); }
  .task-head { display:flex; align-items:flex-start; gap:12px; }
  .avatar { width:38px; height:38px; border-radius:50%; background: var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; }
  .task-who { flex:1; min-width:0; }
  .task-who .name { font-weight:700; font-size:13.5px; }
  .task-who .role { font-size:12px; color: var(--text-muted); }
  .task-when { text-align:right; white-space:nowrap; }
  .urg-tag { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; display:inline-block; margin-bottom:4px; }
  .urg-hoy { background: var(--critical-bg); color: var(--critical); }
  .urg-normal { background: var(--neutral-bg); color: var(--neutral-ink); }
  .task-time { display:block; font-size:11.5px; color: var(--text-muted); }

  .task-subject { font-weight:700; font-size:14.5px; margin: 10px 0 10px; }

  .ask-box { background: var(--accent-bg); border-radius:10px; padding:10px 12px; margin-bottom:12px; }
  .ask-box .label { display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; color: var(--accent); margin-bottom:4px; text-transform:uppercase; letter-spacing:.01em; }
  .ask-box p { margin:0; font-size:13.5px; line-height:1.5; }

  .files-label { font-size:12px; color: var(--text-muted); margin-bottom:6px; }
  .files { display:grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap:8px; margin-bottom:12px; }
  .file-card { display:flex; align-items:center; gap:10px; border:1px solid var(--gridline); border-radius:10px; padding:8px 10px; background: var(--surface-1); text-decoration:none; }
  .file-icon { width:30px; height:30px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:800; flex-shrink:0; }
  .file-meta { flex:1; min-width:0; }
  .file-meta .fname { font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color: var(--text-primary); }
  .file-meta .fsub { font-size:11px; color: var(--text-muted); }
  .file-open { font-size:11px; font-weight:700; color: var(--accent); background:none; border:none; }

  .status-row { display:flex; gap:6px; margin-bottom:10px; }
  .status-pill { flex:1; text-align:center; font-size:12px; font-weight:700; padding:8px 6px; border-radius:9px; border:1px solid var(--gridline); background: var(--surface-1); color: var(--text-secondary); cursor:pointer; }
  .status-pill.active[data-status="pendiente"] { background: var(--neutral-bg); color: var(--neutral-ink); border-color:transparent; }
  .status-pill.active[data-status="proceso"] { background: var(--warning-bg); color: var(--warning); border-color:transparent; }
  .status-pill.active[data-status="hecho"] { background: var(--good-bg); color: var(--good); border-color:transparent; }
  .status-pill:disabled { opacity:.6; cursor:default; }

  .reply-btn { display:block; width:100%; text-align:center; font-size:13px; font-weight:700; color: var(--text-primary); background: var(--surface-1); border:1px solid var(--gridline); border-radius:9px; padding:9px; cursor:pointer; text-decoration:none; }
  .reply-btn.disabled { color: var(--text-muted); cursor:default; }

  .safe-note { font-size:11px; color: var(--text-muted); margin-top:8px; text-align:center; }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><div class="logo"></div><div>Pendientes Correos</div></div>
  <div class="search"><input type="text" id="searchInput" placeholder="Buscar empresa, persona o correo..." oninput="applyFilters()"></div>
  <div class="sync-pill" id="syncPill"><span class="dot"></span><span id="syncText">Cargando...</span></div>
  <button class="sync-btn" id="syncBtn" onclick="loadData()">⟳ Actualizar</button>
  <div class="user"><div class="av">I</div><div class="who"><b>Iliana</b>Coordinación</div></div>
  <button class="theme-btn" onclick="toggleTheme()">🌙</button>
</header>

<div class="tabs">
  <div class="tab active">Carpetas por empresa</div>
  <div class="tab">Para hoy</div>
  <div class="tab">Completados</div>
  <div class="tab">Ayuda / Guía fácil</div>
</div>

<div class="wrap">
  <div id="errorBox"></div>

  <div class="greet">
    <div class="greet-left">
      <div class="greet-icon">👋</div>
      <div>
        <h2>Hola Iliana, <span id="greetCount">cargando tus pendientes...</span></h2>
        <p id="greetSub">Un momento...</p>
        <div class="calm">✓ Tómate tu tiempo. Abre una carpeta a la vez para ver qué te piden sin agobiarte.</div>
      </div>
    </div>
    <button class="urgent-toggle" id="urgentToggle" onclick="toggleUrgentFilter()">● Ver sólo lo urgente de hoy&nbsp;<span id="urgentCount">0</span></button>
  </div>

  <div class="pace">
    <div class="pace-text"><b id="paceTitle">Ritmo de hoy</b><span id="paceSub">—</span></div>
    <div class="pace-bar-wrap">
      <div class="pace-bar-top"><span>Progreso general</span><span id="pacePct">0%</span></div>
      <div class="pace-bar"><div class="pace-bar-fill" id="paceFill" style="width:0%"></div></div>
    </div>
  </div>

  <div id="companies"></div>
</div>

<script>
/* ====== CONFIGURACIÓN — datos de tu backend (Supabase Edge Function) ====== */
const BACKEND_URL = 'https://ddorhtkezlliavzfvolt.supabase.co/functions/v1/pendientes';
const SHARED_KEY = '19dcef06-f30b-4fb5-9e93-5de7501a5edd'; // debe ser igual al secreto SHARED_KEY de la función
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkb3JodGtlemxsaWF2emZ2b2x0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1OTc5NTEsImV4cCI6MjEwNjE3Mzk1MX0.ReN2FisXLMZrFl02UjKtL4okVDPrP5qwiKZolLMoyYM'; // llave pública del proyecto, la exige Supabase en cada llamada
/* ================================================================================ */

let allItems = [];
let showOnlyUrgent = false;

function initials(name) {
  if (!name) return '?';
  return name.split(' ').filter(w => w.length > 1).map(w => w[0]).slice(0, 2).join('').toUpperCase();
}

function toBool(v) {
  return v === true || v === 'TRUE' || v === 'true' || v === 1;
}

function fileIcon(type) {
  const t = (type || '').toLowerCase();
  if (t.includes('pdf')) return `<div class="file-icon" style="background:var(--pdf)">PDF</div>`;
  if (t.includes('xls') || t.includes('sheet')) return `<div class="file-icon" style="background:var(--xls)">XLS</div>`;
  return `<div class="file-icon" style="background:var(--generic)">FILE</div>`;
}

function statusPills(id, status) {
  const opts = [['pendiente','Pendiente'],['proceso','En proceso'],['hecho','Hecho']];
  return opts.map(([k,l]) =>
    `<div class="status-pill ${status===k?'active':''}" data-status="${k}" onclick="setStatus('${id}', '${k}', this)">${l}</div>`
  ).join('');
}

function setSync(text, isErr) {
  document.getElementById('syncText').textContent = text;
  document.getElementById('syncPill').classList.toggle('err', !!isErr);
}

function showError(msg) {
  document.getElementById('errorBox').innerHTML = `<div class="error-box">${msg}</div>`;
}
function clearError() {
  document.getElementById('errorBox').innerHTML = '';
}

async function loadData() {
  const btn = document.getElementById('syncBtn');
  btn.disabled = true;
  setSync('Actualizando...');
  clearError();
  try {
    const res = await fetch(`${BACKEND_URL}?key=${encodeURIComponent(SHARED_KEY)}`, {
      headers: { 'Authorization': `Bearer ${ANON_KEY}`, 'apikey': ANON_KEY }
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Error desconocido del backend');
    allItems = data.items || [];
    setSync('Bandeja al día · ' + new Date().toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'}));
    render();
  } catch (err) {
    setSync('Sin conexión', true);
    showError('No pude cargar los pendientes (' + err.message + '). Revisa que el link del backend y la llave sean correctos, o inténtalo de nuevo en un momento.');
  } finally {
    btn.disabled = false;
  }
}

async function setStatus(id, status, el) {
  const row = el.closest('.status-row');
  row.querySelectorAll('.status-pill').forEach(p => p.disabled = true);
  try {
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ANON_KEY}`, 'apikey': ANON_KEY },
      body: JSON.stringify({ key: SHARED_KEY, action: 'update_status', id: id, status: status })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'no se pudo guardar');
    const item = allItems.find(i => i.id === id);
    if (item) item.status = status;
    render();
  } catch (err) {
    showError('No se pudo guardar el nuevo estatus (' + err.message + '). Vuelve a intentar.');
    row.querySelectorAll('.status-pill').forEach(p => p.disabled = false);
  }
}

function toggleUrgentFilter() {
  showOnlyUrgent = !showOnlyUrgent;
  document.getElementById('urgentToggle').classList.toggle('active', showOnlyUrgent);
  render();
}

function applyFilters() { render(); }

function groupByCompany(items) {
  const map = {};
  items.forEach(it => {
    const key = it.company || 'Sin empresa';
    if (!map[key]) map[key] = [];
    map[key].push(it);
  });
  return Object.keys(map).sort().map(name => ({ company: name, tasks: map[name] }));
}

function render() {
  const searchTerm = (document.getElementById('searchInput').value || '').toLowerCase();

  let items = allItems.slice();
  if (showOnlyUrgent) items = items.filter(i => toBool(i.urgent) && i.status !== 'hecho');
  if (searchTerm) {
    items = items.filter(i =>
      (i.company || '').toLowerCase().includes(searchTerm) ||
      (i.sender_name || '').toLowerCase().includes(searchTerm) ||
      (i.sender_email || '').toLowerCase().includes(searchTerm) ||
      (i.subject || '').toLowerCase().includes(searchTerm)
    );
  }

  // resumen
  const total = allItems.length;
  const hechos = allItems.filter(i => i.status === 'hecho').length;
  const pendientesActivos = total - hechos;
  const urgentesActivos = allItems.filter(i => toBool(i.urgent) && i.status !== 'hecho').length;
  const pct = total ? Math.round((hechos / total) * 100) : 0;

  document.getElementById('greetCount').textContent = total
    ? `hoy tienes ${pendientesActivos} correo${pendientesActivos===1?'':'s'} con tareas`
    : 'no hay pendientes registrados todavía';
  document.getElementById('greetSub').textContent = `Organizados en ${groupByCompany(allItems).length} empresa(s).`;
  document.getElementById('urgentCount').textContent = urgentesActivos;
  document.getElementById('paceTitle').textContent = total ? 'Ritmo de hoy' : 'Aún no hay nada que revisar';
  document.getElementById('paceSub').textContent = total ? `Has resuelto ${hechos} de ${total} pendientes.` : 'En cuanto se sincronice tu correo, aquí verás tu avance.';
  document.getElementById('pacePct').textContent = pct + '%';
  document.getElementById('paceFill').style.width = pct + '%';

  const container = document.getElementById('companies');
  container.innerHTML = '';

  if (!items.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="big">📭</div>
        <div>${total ? 'Nada coincide con tu búsqueda o filtro.' : 'Todavía no hay correos sincronizados. En cuanto corra el primer escaneo, aparecerán aquí agrupados por empresa.'}</div>
      </div>`;
    return;
  }

  const groups = groupByCompany(items);

  groups.forEach((group, gi) => {
    const div = document.createElement('div');
    div.className = 'company' + (gi === 0 ? ' open' : '');
    const pendCount = group.tasks.filter(t => t.status !== 'hecho').length;

    div.innerHTML = `
      <div class="company-header" onclick="this.parentElement.classList.toggle('open')">
        <div class="co-icon">${initials(group.company)}</div>
        <div class="co-main">
          <div class="co-title-row"><span class="co-name">${group.company}</span><span class="co-badge">${pendCount} activo(s)</span></div>
          <div class="co-sub">${group.tasks.length} correo(s) en total</div>
        </div>
        <div class="co-toggle">Ver / cerrar carpeta</div>
      </div>
      <div class="co-body">
        <div class="co-sortline"><span>Mostrando ${group.tasks.length} correo(s) de esta empresa</span><span>Ordenados por fecha</span></div>
        ${group.tasks.map(t => `
          <div class="task">
            <div class="task-head">
              <div class="avatar">${initials(t.sender_name)}</div>
              <div class="task-who"><div class="name">${t.sender_name || 'Remitente desconocido'}</div><div class="role">${t.sender_role || t.sender_email || ''}</div></div>
              <div class="task-when">
                <span class="urg-tag ${toBool(t.urgent) ? 'urg-hoy' : 'urg-normal'}">${toBool(t.urgent) ? 'Urgente' : 'Normal'}</span>
                <span class="task-time">${t.date_received || ''}${t.due_date ? ' · vence ' + t.due_date : ''}</span>
              </div>
            </div>
            <div class="task-subject">${t.subject || '(sin asunto)'}</div>
            <div class="ask-box"><div class="label">❓ ¿Qué te están pidiendo exactamente?</div><p>${t.summary || 'Sin resumen disponible.'}</p></div>
            ${(t.attachments && t.attachments.length) ? `
              <div class="files-label">Archivos que vienen con este correo:</div>
              <div class="files">${t.attachments.map(f => `
                <a class="file-card" href="${f.url || '#'}" target="_blank">${fileIcon(f.type)}<div class="file-meta"><div class="fname">${f.name}</div><div class="fsub">${f.size || ''}</div></div><span class="file-open">Abrir ↗</span></a>
              `).join('')}</div>
            ` : ''}
            <div class="status-row">${statusPills(t.id, t.status || 'pendiente')}</div>
            ${t.mail_url
              ? `<a class="reply-btn" href="${t.mail_url}" target="_blank">✉ Responder correo</a>`
              : `<div class="reply-btn disabled">✉ Responder correo (aún no disponible)</div>`}
            <div class="safe-note">Al marcar como "Hecho", el pendiente se archiva aquí — el correo sigue intacto en tu bandeja.</div>
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(div);
  });
}

function toggleTheme() {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  root.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
}

loadData();
</script>
</body>
